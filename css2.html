<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Techodex — CSS Quiz 2: Box Model</title>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
  <style>
    :root{
      --bg-0:#071428;
      --muted:#bfcbdc;
      --accent:#00aaff;
      --accent-2:#7b61ff;
      --success:#00d18a;
      --danger:#ff4f9a;
      --card-radius:12px;
      --max-width:980px;
      --gap:12px;
    }

    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:linear-gradient(180deg,var(--bg-0),#041226);color:#eaf6ff;-webkit-font-smoothing:antialiased}
    .wrap{max-width:var(--max-width);margin:28px auto;padding:18px}

    /* Header */
    .site-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
    .nameplate{font-weight:800}
    .nav-links a{color:var(--muted);margin-left:12px;text-decoration:none;font-weight:700}

    /* Card */
    .quiz-card{
      background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
      padding:18px;border-radius:var(--card-radius);border:1px solid rgba(255,255,255,0.04);
      box-shadow:0 18px 48px rgba(0,0,0,0.6);
    }

    .quiz-header{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .quiz-header h1{margin:0;font-size:1.25rem}
    .quiz-header .sub{color:var(--muted);font-size:0.95rem;margin:0}

    /* Progress */
    .progress-row{display:flex;align-items:center;gap:12px;margin-top:6px}
    .progress-bar{flex:1;height:12px;background:rgba(255,255,255,0.03);border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .28s ease}
    .score{min-width:72px;text-align:right;color:var(--muted);font-weight:800}

    /* Questions */
    .questions{display:grid;gap:var(--gap);margin-top:14px}
    .question{background:linear-gradient(180deg,#071a2b,#061423);border-radius:10px;padding:14px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 24px rgba(0,0,0,0.5)}
    .question h2{margin:0 0 8px 0;font-size:1rem}
    .question p{margin:0 0 12px 0;color:var(--muted);white-space:pre-wrap}

    /* Options */
    .options{display:grid;gap:10px}
    .option{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:linear-gradient(180deg,#0b2a44,#072033);border:1px solid rgba(255,255,255,0.03);color:#eaf6ff;font-weight:800;cursor:pointer;transition:transform .08s ease,box-shadow .12s ease}
    .option:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.45)}
    .option.correct{background:linear-gradient(90deg,var(--success),#2fe0b0);color:#071428}
    .option.wrong{background:linear-gradient(90deg,var(--danger),#ff7aa6);color:#071428}
    .option .label{flex:1;text-align:left;white-space:pre-wrap}

    /* Controls */
    .controls{display:flex;gap:10px;align-items:center;margin-top:14px}
    .btn{padding:10px 14px;border-radius:10px;border:0;font-weight:900;cursor:pointer}
    .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#071428}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
    .final{margin-left:12px;color:var(--muted);font-weight:800}

    @media (max-width:720px){
      .wrap{padding:12px}
      .quiz-card{padding:14px}
      .option{padding:10px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header" role="banner">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div class="nameplate">Techodex</div>
          <div style="color:var(--muted);font-size:0.92rem">CSS Quiz 2</div>
        </div>
      </div>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="../../index.html">Home</a>
        <a href="../../lessons/index.html">Lessons</a>
        <a href="../index.html">Quizzes</a>
        <a href="../../game/index.html">Game</a>
      </nav>
    </header>

    <article class="quiz-card" role="main" aria-labelledby="quizTitle">
      <header class="quiz-header">
        <h1 id="quizTitle">CSS Quiz 2 — Box Model</h1>
        <div class="sub">Five focused questions on margin, padding, border, box-sizing, and shorthand. Instant feedback, randomized, no repeats.</div>

        <div class="progress-row" aria-hidden="false">
          <div class="progress-bar" aria-hidden="true"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
          <div class="score" id="scoreBadge">0 / 5</div>
        </div>
      </header>

      <section id="questions" class="questions" aria-live="polite"></section>

      <div class="controls" aria-hidden="false">
        <button id="restart" class="btn ghost" type="button">Shuffle & Restart</button>
        <button id="finish" class="btn primary" type="button">Finish</button>
        <div id="final" class="final" aria-live="polite"></div>
      </div>
    </article>
  </div>

  <script>
    (function () {
      // Bank larger than 5 to avoid repetition
      const BANK = [
        { q: 'Which CSS property controls the space between the content and the border of an element?', opts: ['margin', 'padding', 'border', 'gap'], correct: 1 },
        { q: 'What does margin: 20px; do?', opts: ['Adds space inside the border', 'Adds space outside the border', 'Increases border thickness', 'Changes background color'], correct: 1 },
        { q: 'Which property sets the thickness of the border?', opts: ['border-width', 'margin', 'padding', 'outline'], correct: 0 },
        { q: 'Which shorthand sets margin for all four sides?', opts: ['margin: 10px;', 'margin-all: 10px;', 'margin-sides: 10px;', 'margin-box: 10px;'], correct: 0 },
        { q: 'Which property changes how width and height are calculated (includes padding and border)?', opts: ['box-sizing', 'display', 'overflow', 'content-box'], correct: 0 },
        { q: 'Which box-sizing value includes padding and border in the element\'s total width?', opts: ['border-box', 'content-box', 'padding-box', 'inner-box'], correct: 0 },
        { q: 'Which property adds space between table cells?', opts: ['border-spacing', 'cell-padding', 'gap', 'padding'], correct: 0 },
        { q: 'Which property does NOT affect the box model layout (visual only)?', opts: ['box-shadow', 'padding', 'margin', 'border'], correct: 0 },
        { q: 'Which shorthand sets padding for top/right/bottom/left in that order?', opts: ['padding: 10px 8px 6px 4px;', 'padding: 10px 6px 8px 4px;', 'padding: 10px 8px 4px 6px;', 'padding: 4px 6px 8px 10px;'], correct: 0 },
        { q: 'What happens when two vertical margins of adjacent block elements meet?', opts: ['They collapse into a single margin', 'They add together', 'The larger is ignored', 'They become padding'], correct: 0 }
      ];

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildQuiz() {
        return shuffle(BANK).slice(0, 5).map(q => {
          const optsShuffled = shuffle(q.opts.map((t, idx) => ({ t, idx })));
          const correctText = q.opts[q.correct];
          const correctIndex = optsShuffled.findIndex(o => o.t === correctText);
          return {
            id: 'q-' + Math.random().toString(36).slice(2, 8),
            q: q.q,
            opts: optsShuffled.map(o => o.t),
            correctIndex
          };
        });
      }

      let selected = buildQuiz();
      let selections = {}; // qid -> chosen index
      let score = 0;

      const questionsEl = document.getElementById('questions');
      const progressFill = document.getElementById('progressFill');
      const scoreBadge = document.getElementById('scoreBadge');
      const finalEl = document.getElementById('final');
      const finishBtn = document.getElementById('finish');
      const restartBtn = document.getElementById('restart');

      function render() {
        questionsEl.innerHTML = '';
        selected.forEach((item, i) => {
          const sec = document.createElement('section');
          sec.className = 'question';
          sec.id = item.id;
          sec.setAttribute('aria-labelledby', `${item.id}-title`);

          const h2 = document.createElement('h2');
          h2.id = `${item.id}-title`;
          h2.textContent = `Question ${i + 1}`;
          sec.appendChild(h2);

          const p = document.createElement('p');
          p.textContent = item.q;
          sec.appendChild(p);

          const opts = document.createElement('div');
          opts.className = 'options';
          opts.setAttribute('role', 'list');

          item.opts.forEach((optText, oi) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option';
            btn.setAttribute('data-q', item.id);
            btn.setAttribute('data-idx', oi);
            btn.setAttribute('aria-pressed', 'false');

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = optText;

            btn.appendChild(label);
            btn.addEventListener('click', onSelect);
            opts.appendChild(btn);
          });

          sec.appendChild(opts);
          questionsEl.appendChild(sec);
        });

        updateProgress();
      }

      function onSelect(e) {
        const btn = e.currentTarget;
        const qid = btn.getAttribute('data-q');
        const idx = Number(btn.getAttribute('data-idx'));
        if (selections[qid] != null) return; // already answered

        selections[qid] = idx;
        const item = selected.find(s => s.id === qid);
        const container = document.getElementById(qid);
        const buttons = Array.from(container.querySelectorAll('.option'));
        buttons.forEach(b => b.disabled = true);

        const chosen = container.querySelector(`.option[data-idx="${idx}"]`);
        const correct = container.querySelector(`.option[data-idx="${item.correctIndex}"]`);

        if (idx === item.correctIndex) {
          chosen.classList.add('correct');
          score++;
        } else {
          chosen.classList.add('wrong');
          if (correct) correct.classList.add('correct');
        }

        buttons.forEach(b => b.setAttribute('aria-pressed', 'false'));
        chosen.setAttribute('aria-pressed', 'true');
        if (correct) correct.setAttribute('aria-pressed', 'true');

        updateProgress();
      }

      function updateProgress() {
        const answered = Object.keys(selections).length;
        const total = selected.length;
        const percent = Math.round((answered / total) * 100);
        progressFill.style.width = percent + '%';
        scoreBadge.textContent = `${score} / ${total}`;
      }

      function finish() {
        selected.forEach(item => {
          if (selections[item.id] == null) {
            const container = document.getElementById(item.id);
            const buttons = Array.from(container.querySelectorAll('.option'));
            buttons.forEach(b => b.disabled = true);
            const correct = container.querySelector(`.option[data-idx="${item.correctIndex}"]`);
            if (correct) correct.classList.add('correct');
          }
        });
        updateProgress();
        finalEl.textContent = `Final score: ${score} / ${selected.length}`;
        finishBtn.disabled = true;
      }

      function restart() {
        selections = {};
        score = 0;
        finalEl.textContent = '';
        finishBtn.disabled = false;
        selected = buildQuiz();
        render();
      }

      finishBtn.addEventListener('click', finish);
      restartBtn.addEventListener('click', restart);

      // initial render
      render();

      // expose for debugging if needed
      window.__tdx_css2 = { selected, selections };
    })();
  </script>
</body>
</html>
