<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Techodex — HTML Quiz 2: Text & Headings</title>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
  <style>
    :root{
      --bg-0:#071428;--muted:#bfcbdc;--accent:#00aaff;--accent-2:#7b61ff;
      --success:#00d18a;--danger:#ff4f9a;--card-radius:12px;--max-width:980px;--gap:12px;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,"Segoe UI",Roboto,Arial;background:linear-gradient(180deg,var(--bg-0),#041226);color:#eaf6ff}
    .wrap{max-width:var(--max-width);margin:28px auto;padding:18px}
    .site-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
    .nameplate{font-weight:800}
    .nav-links a{color:var(--muted);margin-left:12px;text-decoration:none;font-weight:700}
    .quiz-card{background:rgba(255,255,255,0.02);padding:18px;border-radius:var(--card-radius);border:1px solid rgba(255,255,255,0.04);box-shadow:0 18px 48px rgba(0,0,0,0.6)}
    .quiz-header{margin-bottom:12px}
    .quiz-header h1{margin:0;font-size:1.25rem}
    .quiz-header .sub{color:var(--muted);font-size:0.95rem}
    .progress-row{display:flex;align-items:center;gap:12px;margin-top:6px}
    .progress-bar{flex:1;height:12px;background:rgba(255,255,255,0.03);border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .28s ease}
    .score{min-width:72px;text-align:right;color:var(--muted);font-weight:800}
    .questions{display:grid;gap:var(--gap);margin-top:14px}
    .question{background:linear-gradient(180deg,#071a2b,#061423);border-radius:10px;padding:14px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 24px rgba(0,0,0,0.5)}
    .question h2{margin:0 0 8px 0;font-size:1rem}
    .question p{margin:0 0 12px 0;color:var(--muted)}
    .options{display:grid;gap:10px}
    .option{padding:10px 12px;border-radius:10px;background:linear-gradient(180deg,#0b2a44,#072033);border:1px solid rgba(255,255,255,0.03);color:#eaf6ff;font-weight:800;cursor:pointer;display:flex;align-items:center}
    .option:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.45)}
    .option.correct{background:linear-gradient(90deg,var(--success),#2fe0b0);color:#071428}
    .option.wrong{background:linear-gradient(90deg,var(--danger),#ff7aa6);color:#071428}
    .option .label{flex:1;text-align:left;white-space:pre-wrap}
    .controls{display:flex;gap:10px;align-items:center;margin-top:14px}
    .btn{padding:10px 14px;border-radius:10px;font-weight:900;cursor:pointer}
    .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#071428}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
    .final{margin-left:12px;color:var(--muted);font-weight:800}
    @media (max-width:720px){
      .wrap{padding:12px}
      .quiz-card{padding:14px}
      .option{padding:10px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div class="nameplate">Techodex</div>
          <div style="color:var(--muted);font-size:0.92rem">HTML Quiz 2</div>
        </div>
      </div>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="../../index.html">Home</a>
        <a href="../../lessons/index.html">Lessons</a>
        <a href="../index.html">Quizzes</a>
        <a href="../../game/index.html">Game</a>
      </nav>
    </header>

    <article class="quiz-card" role="main" aria-labelledby="quizTitle">
      <header class="quiz-header">
        <h1 id="quizTitle">HTML Quiz 2 — Text & Headings</h1>
        <div class="sub">Five randomized questions. Instant feedback, no repeats.</div>

        <div class="progress-row" aria-hidden="false">
          <div class="progress-bar" aria-hidden="true"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
          <div class="score" id="scoreBadge">0 / 5</div>
        </div>
      </header>

      <section id="questions" class="questions" aria-live="polite"></section>

      <div class="controls" aria-hidden="false">
        <button id="restart" class="btn ghost" type="button">Shuffle & Restart</button>
        <button id="finish" class="btn primary" type="button">Finish</button>
        <div id="final" class="final" aria-live="polite"></div>
      </div>
    </article>
  </div>

  <script>
    (function(){
      const BANK = [
        {q:'Which tag creates a paragraph?',opts:['<p>','<para>','<text>','<paragraph>'],correct:0},
        {q:'Which heading tag is the smallest?',opts:['<h1>','<h3>','<h6>','<h7>'],correct:2},
        {q:'Which tag makes text bold?',opts:['<b>','<strong>','Both <b> and <strong>','<bold>'],correct:2},
        {q:'Which tag makes text italic?',opts:['<i>','<em>','Both <i> and <em>','<italic>'],correct:2},
        {q:'Which tag inserts a line break?',opts:['<br>','<lb>','<break>','<line>'],correct:0},
        {q:'Which tag is used for emphasized text?',opts:['<em>','<i>','<strong>','<mark>'],correct:0},
        {q:'Which tag highlights text?',opts:['<mark>','<highlight>','<span>','<em>'],correct:0},
        {q:'Which tag defines subscript text?',opts:['<sub>','<sup>','<small>','<script>'],correct:0},
        {q:'Which tag defines superscript text?',opts:['<sup>','<sub>','<small>','<script>'],correct:0},
        {q:'Which tag is used for smaller text?',opts:['<small>','<tiny>','<span>','<p>'],correct:0}
      ];

      function shuffle(arr){
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildQuiz(){
        return shuffle(BANK).slice(0,5).map(q => {
          const optsShuffled = shuffle(q.opts.map((t,i) => ({ t, i })));
          const correctText = q.opts[q.correct];
          const correctIndex = optsShuffled.findIndex(o => o.t === correctText);
          return { id: q.q.slice(0,8).replace(/\W/g,'') + '-' + Math.random().toString(36).slice(2,6), q: q.q, opts: optsShuffled.map(o => o.t), correctIndex };
        });
      }

      let selected = buildQuiz();
      let selections = {}; // qid -> chosen index
      let score = 0;

      const questionsEl = document.getElementById('questions');
      const progressFill = document.getElementById('progressFill');
      const scoreBadge = document.getElementById('scoreBadge');
      const finalEl = document.getElementById('final');
      const finishBtn = document.getElementById('finish');
      const restartBtn = document.getElementById('restart');

      function render(){
        questionsEl.innerHTML = '';
        selected.forEach((item, i) => {
          const sec = document.createElement('section');
          sec.className = 'question';
          sec.id = 'q-' + item.id;
          sec.setAttribute('aria-labelledby', `q-${item.id}-title`);

          const h2 = document.createElement('h2');
          h2.id = `q-${item.id}-title`;
          h2.textContent = `Question ${i + 1}`;
          sec.appendChild(h2);

          const p = document.createElement('p');
          p.textContent = item.q;
          sec.appendChild(p);

          const opts = document.createElement('div');
          opts.className = 'options';
          opts.setAttribute('role', 'list');

          item.opts.forEach((optText, oi) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option';
            btn.setAttribute('data-q', item.id);
            btn.setAttribute('data-idx', oi);
            btn.setAttribute('aria-pressed', 'false');

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = optText;

            btn.appendChild(label);
            btn.addEventListener('click', onSelect);
            opts.appendChild(btn);
          });

          sec.appendChild(opts);
          questionsEl.appendChild(sec);
        });

        updateProgress();
      }

      function onSelect(e){
        const btn = e.currentTarget;
        const qid = btn.getAttribute('data-q');
        const idx = Number(btn.getAttribute('data-idx'));
        if (selections[qid] != null) return; // already answered

        selections[qid] = idx;
        const item = selected.find(s => s.id === qid);
        const container = document.getElementById('q-' + qid);
        const buttons = Array.from(container.querySelectorAll('.option'));
        buttons.forEach(b => b.disabled = true);

        const chosen = container.querySelector(`.option[data-idx="${idx}"]`);
        const correct = container.querySelector(`.option[data-idx="${item.correctIndex}"]`);

        if (idx === item.correctIndex) {
          chosen.classList.add('correct');
          score++;
        } else {
          chosen.classList.add('wrong');
          if (correct) correct.classList.add('correct');
        }

        buttons.forEach(b => b.setAttribute('aria-pressed', 'false'));
        chosen.setAttribute('aria-pressed', 'true');
        if (correct) correct.setAttribute('aria-pressed', 'true');

        updateProgress();
      }

      function updateProgress(){
        const answered = Object.keys(selections).length;
        const total = selected.length;
        const percent = Math.round((answered / total) * 100);
        progressFill.style.width = percent + '%';
        scoreBadge.textContent = `${score} / ${total}`;
      }

      function finish(){
        selected.forEach(item => {
          if (selections[item.id] == null) {
            const container = document.getElementById('q-' + item.id);
            const buttons = Array.from(container.querySelectorAll('.option'));
            buttons.forEach(b => b.disabled = true);
            const correct = container.querySelector(`.option[data-idx="${item.correctIndex}"]`);
            if (correct) correct.classList.add('correct');
          }
        });
        updateProgress();
        finalEl.textContent = `Final score: ${score} / ${selected.length}`;
        finishBtn.disabled = true;
      }

      function restart(){
        selections = {};
        score = 0;
        finalEl.textContent = '';
        finishBtn.disabled = false;
        selected = buildQuiz();
        render();
      }

      finishBtn.addEventListener('click', finish);
      restartBtn.addEventListener('click', restart);

      // initial render
      render();

      // expose for debugging
      window.__tdx_html2 = { selected, selections };
    })();
  </script>
</body>
</html>
